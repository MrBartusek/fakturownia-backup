fakturownia:
  # Ustawienia -> API -> Zobacz, rodzaj: "Token z prefiksem"
  # Albo zwykły token z dopisaną subdomeną: <token>/<nazwa> dla adresu <nazwa>.fakturownia.pl
  token: twoj-token/twoja-firma

# Folder, do którego pobierane są faktury (w Dockerze zostaw /fakturownia)
output: /fakturownia

# Harmonogram pobierania faktur w formacie cron
cron: '0 1 * * *'
